<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sarkar AI - Web Assistant</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #0f172a; color: #f8fafc; display: flex; justify-content: center; align-items: center; height: 100vh; }
        .chat-container { width: 100%; max-width: 600px; height: 85vh; background-color: #1e293b; border-radius: 12px; display: flex; flex-direction: column; box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3); border: 1px solid #334155; }
        .chat-header { padding: 20px; background-color: #0f172a; border-top-left-radius: 12px; border-top-right-radius: 12px; border-bottom: 1px solid #334155; text-align: center; }
        .chat-header h1 { font-size: 1.5rem; color: #38bdf8; }
        .chat-messages { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 15px; }
        .message { max-width: 75%; padding: 12px 16px; border-radius: 8px; line-height: 1.4; white-space: pre-wrap; }
        .user-message { background-color: #0284c7; align-self: flex-end; color: white; }
        .bot-message { background-color: #334155; align-self: flex-start; color: #f1f5f9; }
        .chat-input-area { padding: 15px; background-color: #0f172a; border-bottom-left-radius: 12px; border-bottom-right-radius: 12px; display: flex; gap: 10px; border-top: 1px solid #334155; }
        input { flex: 1; padding: 12px; background-color: #1e293b; border: 1px solid #475569; border-radius: 6px; color: white; font-size: 1rem; }
        input:focus { outline: none; border-color: #38bdf8; }
        button { background-color: #0284c7; color: white; border: none; padding: 0 20px; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 1rem; transition: background 0.2s; }
        button:hover { background-color: #0369a1; }
    </style>
</head>
<body>

    <div class="chat-container">
        <div class="chat-header">
            <h1>Sarkar AI</h1>
            <p style="font-size: 0.85rem; color: #94a3b8;">Web Edition Assistant</p>
        </div>
        
        <div class="chat-messages" id="chatMessages">
            <div class="message bot-message">Hello! I am Sarkar AI. How can I help you today?</div>
        </div>
        
        <div class="chat-input-area">
            <input type="text" id="userInput" placeholder="Type a message..." onkeypress="handleKeyPress(event)">
            <button onclick="sendMessage()">Send</button>
        </div>
    </div>

    <script type="module">
        import { GoogleGenerativeAI } from "https://esm.run/@google/generative-ai";

        let genAI = null;
        let model = null;
        let verifiedKey = sessionStorage.getItem("gemini_session_key") || "";

        function checkPasscodeOrKey() {
            if (!verifiedKey) {
                // Ask the user for either your secret passcode OR a raw API key
                let userInput = prompt("Enter the Secret Passcode (or your own Gemini API Key) to chat:");
                
                if (!userInput) return null;
                
                let cleanedInput = userInput.trim();

                // 🌟 SECRET PASSCODE CHECK
                // If they type your friend code, it securely loads your split key!
                if (cleanedInput === "SarkarFriends2026") {
                    const p1 = "AQ.Ab8RN6JpZSIWyyYNXTl3FSpzWw";
                    const p2 = "QJmxrjwLx_KWSlsAHZiKHuoQ";
                    verifiedKey = p1 + p2;
                    sessionStorage.setItem("gemini_session_key", verifiedKey);
                } else {
                    // Otherwise, treat what they typed as a standard API key
                    verifiedKey = cleanedInput;
                    sessionStorage.setItem("gemini_session_key", verifiedKey);
                }
            }
            return verifiedKey;
        }

        window.sendMessage = async function() {
            const key = checkPasscodeOrKey();
            if (!key) {
                alert("Access Denied. A valid passcode or API key is required.");
                return;
            }

            const input = document.getElementById('userInput');
            const text = input.value.trim();
            if (!text) return;

            appendMessage(text, 'user-message');
            input.value = '';

            const loadingId = appendMessage("Sarkar AI is thinking...", 'bot-message');

            try {
                if (!genAI) {
                    genAI = new GoogleGenerativeAI(key);
                    model = genAI.getGenerativeModel({ 
                        model: "gemini-2.5-flash",
                        systemInstruction: "You are Sarkar AI, an advanced, brilliant, and witty virtual assistant web edition, co-engineered by Rajarshi Sarkar. Keep responses conversational, smart, and friendly."
                    });
                }

                const result = await model.generateContent(text);
                const responseText = await result.response.text();
                
                updateMessage(loadingId, responseText);
            } catch (error) {
                console.error(error);
                // Clear cache on failure so they can try entering the code again
                sessionStorage.removeItem("gemini_session_key");
                verifiedKey = "";
                genAI = null;
                model = null;
                updateMessage(loadingId, "Connection failed. Please refresh and check that your passcode or API key is perfectly correct.");
            }
        }

        window.handleKeyPress = function(event) {
            if (event.key === 'Enter') {
                sendMessage();
            }
        }

        function appendMessage(text, className) {
            const container = document.getElementById('chatMessages');
            const msgDiv = document.createElement('div');
            const msgId = "msg-" + Date.now();
            msgDiv.id = msgId;
            msgDiv.className = `message ${className}`;
            msgDiv.textContent = text;
            container.appendChild(msgDiv);
            container.scrollTop = container.scrollHeight;
            return msgId;
        }

        function updateMessage(id, newText) {
            const msgDiv = document.getElementById(id);
            if (msgDiv) {
                msgDiv.textContent = newText;
            }
        }
    </script>
</body>
</html>
