<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sarkar AI - Web Assistant</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #0f172a; color: #f8fafc; display: flex; justify-content: center; align-items: center; height: 100vh; flex-direction: column; gap: 10px; }
        
        /* Secure Key Input Configuration Area */
        .config-area { width: 100%; max-width: 600px; background-color: #1e293b; padding: 12px; border-radius: 8px; border: 1px dashed #475569; display: flex; gap: 10px; align-items: center; }
        .config-area label { font-size: 0.85rem; color: #94a3b8; font-weight: bold; }
        .config-area input { flex: 1; padding: 8px; background-color: #0f172a; border: 1px solid #334155; border-radius: 4px; color: #38bdf8; font-family: monospace; font-size: 0.85rem; }
        
        .chat-container { width: 100%; max-width: 600px; height: 75vh; background-color: #1e293b; border-radius: 12px; display: flex; flex-direction: column; box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3); border: 1px solid #334155; }
        .chat-header { padding: 20px; background-color: #0f172a; border-top-left-radius: 12px; border-top-right-radius: 12px; border-bottom: 1px solid #334155; text-align: center; }
        .chat-header h1 { font-size: 1.5rem; color: #38bdf8; }
        .chat-messages { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 15px; }
        .message { max-width: 75%; padding: 12px 16px; border-radius: 8px; line-height: 1.4; white-space: pre-wrap; }
        .user-message { background-color: #0284c7; align-self: flex-end; color: white; }
        .bot-message { background-color: #334155; align-self: flex-start; color: #f1f5f9; }
        .chat-input-area { padding: 15px; background-color: #0f172a; border-bottom-left-radius: 12px; border-bottom-right-radius: 12px; display: flex; gap: 10px; border-top: 1px solid #334155; }
        .chat-input-area input { flex: 1; padding: 12px; background-color: #1e293b; border: 1px solid #475569; border-radius: 6px; color: white; font-size: 1rem; }
        .chat-input-area input:focus { outline: none; border-color: #38bdf8; }
        button { background-color: #0284c7; color: white; border: none; padding: 0 20px; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 1rem; transition: background 0.2s; }
        button:hover { background-color: #0369a1; }
    </style>
</head>
<body>

    <div class="config-area">
        <label for="apiKeyInput">Gemini API Key:</label>
        <input type="password" id="apiKeyInput" placeholder="Paste your API Key here to chat..." value="">
    </div>

    <div class="chat-container">
        <div class="chat-header">
            <h1>Sarkar AI</h1>
            <p style="font-size: 0.85rem; color: #94a3b8;">Web Edition Assistant</p>
        </div>
        
        <div class="chat-messages" id="chatMessages">
            <div class="message bot-message">Hello! Provide your API key above, and I am ready to go. How can I help you today?</div>
        </div>
        
        <div class="chat-input-area">
            <input type="text" id="userInput" placeholder="Type a message..." onkeypress="handleKeyPress(event)">
            <button onclick="sendMessage()">Send</button>
        </div>
    </div>

    <script type="module">
        import { GoogleGenerativeAI } from "https://esm.run/@google/generative-ai";

        // Global instances that get assigned dynamically when you send a message
        let activeChatSession = null;

        async function initializeChatSession(userKey) {
            const genAI = new GoogleGenerativeAI(userKey);
            const model = genAI.getGenerativeModel({ 
                model: "gemini-2.5-flash",
                systemInstruction: "You are Sarkar AI, an advanced, brilliant, and witty virtual assistant web edition, co-engineered by Rajarshi Sarkar. Answer queries intelligently, clearly, and keep a friendly, expert demeanor."
            });

            activeChatSession = model.startChat({
                history: [
                    {
                        role: "user",
                        parts: [{ text: "Hello, identify yourself." }],
                    },
                    {
                        role: "model",
                        parts: [{ text: "Greetings! I am Sarkar AI, co-engineered by Rajarshi Sarkar. Ready to assist." }],
                    }
                ],
            });
        }

        window.sendMessage = async function() {
            const keyInput = document.getElementById('apiKeyInput');
            const currentKey = keyInput.value.trim();
            
            if (!currentKey) {
                alert("Please paste your Gemini API Key in the top box first!");
                return;
            }

            const input = document.getElementById('userInput');
            const text = input.value.trim();
            if (!text) return;

            // Display your user question
            appendMessage(text, 'user-message');
            input.value = '';

            const loadingId = appendMessage("Sarkar AI is thinking...", 'bot-message');

            try {
                // If it's the very first message or the key changed, rebuild the engine dynamically
                if (!activeChatSession) {
                    await initializeChatSession(currentKey);
                }

                const result = await activeChatSession.sendMessage(text);
                const responseText = await result.response.text();
                
                updateMessage(loadingId, responseText);
            } catch (error) {
                console.error(error);
                // Clear the session so it attempts a clean rebuild next time
                activeChatSession = null;
                updateMessage(loadingId, "Oops! Connection refused. Please check that your top API key is completely valid and active.");
            }
        }

        window.handleKeyPress = function(event) {
            if (event.key === 'Enter') {
                sendMessage();
            }
        }

        function appendMessage(text, className) {
            const container = document.getElementById('chatMessages');
            const msgDiv = document.createElement('div');
            const msgId = "msg-" + Date.now();
            msgDiv.id = msgId;
            msgDiv.className =
