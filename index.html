<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sarkar AI - Web Assistant</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #0f172a; color: #f8fafc; display: flex; justify-content: center; align-items: center; height: 100vh; }
        .chat-container { width: 100%; max-width: 600px; height: 80vh; background-color: #1e293b; border-radius: 12px; display: flex; flex-direction: column; box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3); border: 1px solid #334155; }
        .chat-header { padding: 20px; background-color: #0f172a; border-top-left-radius: 12px; border-top-right-radius: 12px; border-bottom: 1px solid #334155; text-align: center; }
        .chat-header h1 { font-size: 1.5rem; color: #38bdf8; }
        .chat-messages { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 15px; }
        .message { max-width: 75%; padding: 12px 16px; border-radius: 8px; line-height: 1.4; white-space: pre-wrap; }
        .user-message { background-color: #0284c7; align-self: flex-end; color: white; }
        .bot-message { background-color: #334155; align-self: flex-start; color: #f1f5f9; }
        .chat-input-area { padding: 15px; background-color: #0f172a; border-bottom-left-radius: 12px; border-bottom-right-radius: 12px; display: flex; gap: 10px; border-top: 1px solid #334155; }
        input { flex: 1; padding: 12px; background-color: #1e293b; border: 1px solid #475569; border-radius: 6px; color: white; font-size: 1rem; }
        input:focus { outline: none; border-color: #38bdf8; }
        button { background-color: #0284c7; color: white; border: none; padding: 0 20px; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 1rem; transition: background 0.2s; }
        button:hover { background-color: #0369a1; }
    </style>
</head>
<body>

    <div class="chat-container">
        <div class="chat-header">
            <h1>Sarkar AI</h1>
            <p style="font-size: 0.85rem; color: #94a3b8;">Web Edition Assistant</p>
        </div>
        
        <div class="chat-messages" id="chatMessages">
            <div class="message bot-message">Hello! I am Sarkar AI. How can I help you today?</div>
        </div>
        
        <div class="chat-input-area">
            <input type="text" id="userInput" placeholder="Type a message..." onkeypress="handleKeyPress(event)">
            <button onclick="sendMessage()">Send</button>
        </div>
    </div>

    <script type="module">
        const API_KEY = "AIzaSyAQjF4PTmx4dB2af56sy_J7eBogwy0j9yo"; 

        window.sendMessage = async function() {
            const input = document.getElementById('userInput');
            const text = input.value.trim();
            if (!text) return;

            appendMessage(text, 'user-message');
            input.value = '';

            const loadingId = appendMessage("Sarkar AI is thinking...", 'bot-message');

            try {
                // Correct beta endpoint structure
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${API_KEY}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{
                            parts: [{ text: "You are Sarkar AI, a brilliant virtual assistant created by Rajarshi Sarkar. Answer this query clearly: " + text }]
                        }]
                    })
                });

                const data = await response.json();
                
                // Read response data mapping accurately
                if (data.candidates && data.candidates[0].content && data.candidates[0].content.parts) {
                    const responseText = data.candidates[0].content.parts[0].text;
                    updateMessage(loadingId, responseText);
                } else {
                    updateMessage(loadingId, "Oops! The API received it, but formatting didn't match. Let's try again.");
                }
            } catch (error) {
                console.error(error);
                updateMessage(loadingId, "Oops! Unable to talk to the server right now. Check your network connection.");
            }
        }

        window.handleKeyPress = function(event) {
            if (event.key === 'Enter') {
                sendMessage();
            }
        }

        function appendMessage(text, className) {
            const container = document.getElementById('chatMessages');
            const msgDiv = document.createElement('div');
            const msgId = "msg-" + Date.now();
            msgDiv.id = msgId;
            msgDiv.className = `message ${className}`;
            msgDiv.textContent = text;
            container.appendChild(msgDiv);
            container.scrollTop = container.scrollHeight;
            return msgId;
        }

        function updateMessage(id, newText) {
            const msgDiv = document.getElementById(id);
            if (msgDiv) {
                msgDiv.textContent = newText;
            }
        }
    </script>
</body>
</html>
